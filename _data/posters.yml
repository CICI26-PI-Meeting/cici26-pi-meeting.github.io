  pdfText: "CICI: UCSS: Towards Secure and Usable Push Notification Authentication for Collaborative Scientific Infrastructures Nitesh Saxena, Texas A&M University, College Station, USA The goal of the project is to enhance the security of push-based and related authentication systems in science infrastructures (e.g., Just-Tap-2FA) by addressing fundamental design vulnerabilities while preserving usability, research questions being: 1. Are existing methods secure and how we can redesign them for better security? 2. Are users able to complete the authentication process successfully without assistance? 3. Do users find the proposed authentication methods more user-friendly than existing solutions? 4. Which authentication method (among those that we have proposed) result in improved security and usability? Research Challenges Broader Impact ● Investigating security of widely deployed 2FA schemes ● Solutions must provide strong security against concurrent and ambiguous authentication attempts without relying on user ○ Investigating security issues in widely used push authentication systems (e.g., universities, government like NSF, and private organizations) and vigilance or attention to multiple notifications. communicating findings through peer-reviewed publications. ● Solutions must preserve low-effort, fast interactions without ● Inclusive authentication for public use in cyberinfrastructure cognitive burden, and ensure clear, distinguishable ○ Developing usable and secure authentication system for public use. authentication feedback for correct session association. ● Collaboration with Industry (e.g., Cisco, Google) ● Solutions must be modular and compatible with real-world ● Student mentoring in Areas of National Importance constraints, enabling seamless integration across existing ● Curriculum Enhancement & Inclusive Outreach scientific cyberinfrastructure and its associated devices, ○ Offer advanced coursework in secure authentication while engaging minority platforms, and accessibility settings. and high school students through inclusive outreach Security Investigation of Design and Real-world (scientific Implementation of infrastructure) Push Secure Push-based Notification Authentication Authentication Systems Method In depth Security Investigation via Systemic Analysis Security & Authentication Clarity & Effectiveness Through Systemic Analysis ● Measure effectiveness of designed attacks Usability ● Evaluate how well methods communicate authentication steps and ● Investigate important insights on systemic’s behavior on attack’s response. support successful completion Investigation ● Compare ease of understanding with existing authentication ● Evaluate detectability of attack entry points through user’s response in the Lab ● Analyze effectiveness across all proposed authentication methods Notable Publications Intellectual Merits ● Countering Concurrent Login Attacks in “Just Tap” Push-based Authentication: A Redesign ● Investigate Security Challenges in and Usability Evaluations [Prakash et al.] (Euro S&P 2021) real-world Push Notification ● Bypassing Push-based Second Factor and Passwordless Authentication with Authentication Deployments Human-Indistinguishable Notifications [Jubur et al.] (AsiaCCS 2021) (AsiaCCS’21, Mobicom’23, WWW’25, ● Breaking Mobile Notification-based Authentication with Concurrent Attacks Outside of Add Your Logo Award ID#: and/or project info here TMC’25) Mobile Devices [Mahdad et al.] (Mobicom 2023) ● Design and Implementation of New ● SoK: A Comprehensive Evaluation of 2FA-based Schemes in the Face of Active Concurrent Push-based Authentication Methods Attacks from User Terminal [Mahdad et al.] (WiSec 2023) (Euro S&P’21) ● Breaching Security Keys without Root: FIDO2 Deception Attacks via Overlays exploiting ● Rigorous Security and Usability Studies Limited Display Authenticators [Mahdad et al.] (ACM CCS 2024) in Lab Settings (Euro S&P’21, ● Usability and Security Analysis of the Compare-and-Confirm Method in Mobile Push-Based Mobicom’23, AsiaCCS’21, ACM CCS’24) Two-Factor Authentication [Jubur et al.] (IEEE MC 2025) ● Broken Access: On the Challenges of Screen Reader Assisted Two-Factor and Passwordless Authentication [Akanda et al.] (WWW 2025) ● An In-Depth Analysis of Password Managers and Two-Factor Authentication Tools [Jubur et al.] (ACM Computing Surveys 2025) ● Comparing a Store-less Password Manager with Traditional Password-Only Authentication The 6th NSF Secure and Trustworthy Cyberspace Principal Investigator Meeting September 4-5, 2024 | Pittsburgh, Pennsylvania [Jubur et al.] (IEEE Internet Computing 2026)"

- title: "CloudSec: Collaborative Policy Alignment for Secure Scientific Computing Infrastructures"
  author: "Joe Stubbs, Eunsuk Kang, Smruti Padhy"
  filename: "CloudSec-Collaborative-Policy-Alignment-for-Secure-Scientific-Computing-Infrastructures-Joe-Stubbs-Eunsuk-Kang-Smruti-Padhy.pdf"
  pdfText: "CloudSec: Collaborative Policy Alignment for Secure Scientiﬁc Computing Infrastructures PI: Joe Stubbs (UT Austin) Co-PIs: Eunsuk Kang (CMU), Smruti Padhy (UT Austin) Overview Year 1 Progress Thurst 1: Interface for Collaborative Policy Alignment ● Collaborative security policy analysis * Designed and implemented Web REST API to manage and analyze security policies for research cyberinfrastructure * Conducted initial evaluation/prototype for NL -> Formal Policy translation based on LLMs ● Understand abstraction gap between * Initial planning for the User Interface, to be implemented this summer on top of API high-level user policies (natural Thrust 2: Cross-layer Policy Alignment Analysis language) and low-level system * Developed a model and formal specification using Alloy for RBAC for security analysis policies (formal language) * Analyzed and validated various policy specifications using Alloy ● Analyze gap using a combination of AI * Integration of analysis as apps and launch analysis as a Tapis job in TACC resources. and formal methods. Thrust 3: Tapis Deployment and Evaluation ● Identify vulnerabilities due to policy * Defined security policies for multiple existing Tapis projects misconfiguration * Aggregated all effective permission for specific users across all data sources * Synthesized concrete Alloy tuples from unified security policies Challenges Addressed Broader Impacts: Two UT Austin grad students (Shan Jiang and Chunyang Zhang) trained and made significant contribution to the project • Researchers and project PIs have a high-level vision of the security requirements for their projects, but technical developers must implement security policies using low-level formal semantics. Next Steps • Collaboration between researcher and developer on security policies requires bridging the abstraction gap between high-level and low-level policy descriptions. * (Summer 2026) User Interface design and Usability Testing Contributions * (Summer 2026 - Fall 2026) Exploring Policy synthesis and repair using LLMs • Development of a new “cross-layer” policy analysis with applications to many * (Fall 2026 - Spring 2027) Use SMT solvers for analysis research infrastructures * (Sprint 2027) Integration of Cloudsec with Tapis • A novel interface for eliciting policy requirements and explanations from project stakeholders • A workflow that facilitates collaborative policy development and refinement Acknowledgement. The Cloudsec project is supported by the National Science Foundation Division CiCI UCSS under Grant No. 2530889 between researchers and technical developers."

- title: "GRISL: Protecting and Hardening Scientific Use of Software Libraries"
  author: "Justin Cappos, Vidya Lakshmi Rajagopalan"
  filename: "GRISL-Protecting-and-Hardening-Scientific-Use-of-Software-Libraries-Justin-Cappos-Vidya-Lakshmi-Rajagopalan.pdf"
  pdfText: "GRISL : Protecting and Hardening Scientific Use Of Software Libraries With GRISL PI: Justin Cappos (New York University) Co-PI: Vidya Lakshmi Rajagopalan (New York University) https://github.com/Lind-Project Project Overview Scientific workflows increasingly rely on highly optimized C/C++ libraries, which often contain vulnerabilities and bugs. v Harden unsafe libraries without changing the scientists’ code. v Use lightweight user space isolation to prevent crashes and data corruption. v Deliver pre-hardened libraries with ~1% performance overhead. v Improve reliability of HPC, AI/ML, and scientific workflows nationwide. Cyber Security Innovation Being Transitioned High performance, backwards-compatible, legacy library isolation for HPC utilizing WebAssembly (WASM) sandboxing principles. v Library Isolation: Established software compartments called cages to ensure that a single library failure cannot compromise the broader application ecosystem. v Dynamic Loading: Enabled dynamic library loading in WASM, allowing for the secure isolation of individual libraries into distinct compartments. v Support for HPC applications: Engineered an API for local, inter-cage, and remote library calls to enable seamless execution of distributed applications. v Policy Interposition: Created customized, per-library system call reference monitors that enable tailored OS restrictions per library. Approach For Transitioning the Innovation v Strong community relationships: Build on 15+ years of secure software deployments (TUF, Uptane, in-toto, etc.) v Open-source release with early / frequent community engagement (SKACH, etc .) and strategic outreach via ORCA under Linux Foundation to gather early feedback and accelerate adoption. Benefits to Scientific Transition Evaluation & Demonstration Risks Versus Potential For Advances Cyberinfrastructure Plan v Risks: Integrating isolation into Society needs science to be accurate, Metrics for success: complex, performance-critical but libraries (AI/ML) often are v Substantial improvements to ~10 widely libraries may expose unforeseen performance-optimized and have used libraries. critical compatibility / hidden flaws. Isolating these libraries v Minimal performance overhead (~1% target). performance issues. Adoption ensures: requires sufficient POC / v Reduction in crashes, data corruption, and v A significant reduction in crashes and debugging time reported by users. momentum. silent data corruption in scientific Integration into major HPC and cloud research v Payoff: Increased reliability, safety, workflows. platforms (JupyterHub, Open OnDemand, and reproducibility for HPC, AI/ML, v Improved reproducibility and CloudLab, Chameleon). Open-source implementation and and scientific computing. This reliability of computational research framework can be applied to AI, community: Prebuilt packages available via results. Conda, pip, and Spack for easy installation. etc. use across domains. The 2nd Cybersecurity Innovation for Cyberinfrastructure (CICI) Principle Investigator Meeting May 11-12, 2026 | Los Angeles, California"

- title: "Safeguarding AI in Bioinformatics: Enhancing Cybersecurity in Biological Data Infrastructure"
  author: "Xiaolong Guo, Yonghui Li, Kaichen Yang"
  filename: "Safeguarding-AI-in-Bioinformatics-Enhancing-Cybersecurity-in-Biological-Data-Infrastructure-Xiaolong-Guo-Yonghui-Li-Kaichen-Yang.pdf"
  pdfText: "CICI: UCSS: Safeguarding AI in Bioinformatics: Enhancing Cybersecurity in Biological Data Infrastructure PI and Co-PIs: Xiaolong Guo, Associate Professor, Kansas State University, guoxiaolong@ksu.edu; Yonghui Li, Professor, Kansas State University, yonghui@ksu.edu Kaichen Yang, Assistant Professor, Michigan Technological University, kaicheny@mtu.edu Project Number: 2419880 Webpage: https://ece.k-state.edu/research/hardware-security/llm.html Bound State Bound State Bacillus subtilis Red Blood Cell Unbound State Candida albicans Escherichia coli Bound State Bound State Backdoor Attacks and Data Poisoning Attacks in Scientific Workflow Peptide Prediction using Generative AI Peptide Synthesis External Validation (Wet-lab) “Trojans” in Peptide/Protein Products? Collaboration and Usability Challenge Addressed: • Generative AI-driven antimicrobial peptide/protein discovery depends on shared data from public databases, collaborators, and local labs. • External protein data may contain errors, mislabeled functions, bias, or intentional poisoning. • Bad training data can cause AI models to generate plausible but ineffective antimicrobial proteins. • These failures are often discovered only after costly wet-lab validation. • Domain scientists lack easy-to-use tools to verify protein data before using it for AI training. • Goal: secure collaborative bioinformatics workflows and build trust in shared antimicrobial protein datasets. Technical Solution: • Represent antimicrobial peptides/proteins as graphs, with amino acids as nodes and biochemical/spatial relationships as edges, and build a curated AMP dataset. • Use graph neural networks, especially GIN, to learn structure-aware embeddings that detect low-quality, mislabeled, biased, or anomalous data. • Study protein-domain data poisoning attacks and build defenses using graph-level detection plus localized anomaly identification. • Deliver an automated verification workflow and outline platform with checking tools, datasets, and security benchmarks. Resulting Benefits to Scientific Result Dissemination Plans: Risks vs. Potential for Advances: Cyberinfrastructure: • Release open-source datasets, • Risks • Improves trust in shared benchmarks, and software tools. • Poisoned data my closely resemble bioinformatics data and AI natural biological variation. • Provide an online testing and workflows. • Limited Validated AMP data may verification platform. cause false positives or false • Catches problematic data before • Publish and present results in negatives. costly downstream experiments. Generative AI, bioinformatics, and • Potential Advances • Supports Safer, more reliable security venues. • Establishes an automated security antimicrobial discovery. • Integrate outcomes into courses, framework for AMP AI workflows. • Provides reusable datasets, tools, outreach, and workforce training. • Introduces a reusable “data firewall” concept for collaborative and benchmarks for the community. bioinformatics The 2nd Cybersecurity Innovation for Cyberinfrastructure (CICI) Principle Investigator Meeting May 11-12, 2026 | Los Angeles, California"

