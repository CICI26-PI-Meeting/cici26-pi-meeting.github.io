  pdfText: "CICI:TCR:SAFARI: Scientific Analytics, Forensics, and Reproducibility for Workflows in Cyberinfrastructure (CI) PI: Michela Taufer (U. of Tennessee, Knoxville) Co-PI: Ewa Deelman (U. Southern California) Team: Kin Ng (UTK), Ty Anderson (UTK), Rajiv Mayani (USC), Jack Marquez (UTK), Jay Lofstead (Sandia) https://globalcomputing.group/safari SAFARI integrates forensic data analytics into the Pegasus Workflow Management System to enhance trustworthiness, reusability, and reproducibility (TR&R) of scientific workflows. By modularizing workflows, embedding provenance and verification, and automating integrity checks, SAFARI ensures results are reliable, secure, and explainable across high-throughput computing Cells: Research-heavy with software aspects , software heavy but including (HTC) platforms research , and balanced between research and software Cybersecurity Innovation Evaluating and Demonstrating Transiton • Embed forensic data analytics directly into workflow systems (Pegasus); ensure • Num. of workflows with embedded forensic analytics with trustworthiness (provenance integrity, validation accuracy) and reproducibility across HPC/HTC platforms. (Metrics) trustworthiness, reusability, and reproducibility (TR&R) of scientific workflows; and • Adoption and reuse of components by Earth science and cross-domain users, with training automate data provenance, validation, and integrity checks for end-to-end security outcomes measured by num. of students and early-career researchers engaged. (Metrics) • Modularize workflows into containerized components for explainability and reuse; and • Open-source forensic workflow modules via Pegasus WMS GitHub, with documentation, establish forensic analytics as a core CI service, setting new standards for open science tutorials, and training through ACCESS affinity groups and workshops. (Community Access) Approach For Transitioning the Innovation • Dissemination via SC, PASC, AGU, AAAS, and community platforms to ensure broad access and • Provide interoperable building blocks (artifacts, toolchains, automation, practices) reproducibility. (Community Access) Programmatic Details • Deliver containerized workflow modules for portability and reusability • 3-year project started on October 2025 • Integrate automated forensic verification frameworks directly into Pegasus workflows • Led by U. of Tennessee, Knoxville with U. of Southern California (ISI) • Train students and researchers through hands-on forensic CI services • Unfunded collaborations with Earth science research groups, ACCESS communities, and Sandia • Engage with communities (ACCESS, SC, PASC, AGU, AAAS) to build adoption pathways National Laboratories Outcomes of Year 1: Capturing Provenance in Scientific Workflows Building arbitrary fine-grained containerized DAG workflows with embedded provenance at every \"WorkflowName\": \"simple_wf\", step for end-to-end forensic traceability Apptainer plugin to enable fine-grained containerization of \"Nodes\": [ App1 Data workflows, ensuring provenance, traceability and reproducibility { Metadata \"ID\": \"node_id\", \"Type\": \"input\"OR “app” Apptainer Dynamic Metadata Dynamic OR “output”, Plugin Build Static Datai App Datao Static \"Container\": App0 Data Plugin App3 Data { \"Name\": \"name\", Metadata Metadata Metadata Metadata Metadata \"InPath\": Dynamic Dynamic Metadata Metadata \"sif/path\", Dynamic Dynamic Static Static Dynamic Static Static Dynamic Dynamic \"Size\": 0, Plugin App2 Data Plugin Static }, Static Static \"Inputs\": [], Metadata Plugin \"Outputs\": [] ● Workflow components are nodes Metadata Dynamic } Dynamic Apptainer Plugin: . representing application or data (input or Static Static ● Builds workflow, executes Provenance Metadata: output) Data Container . Plugin workflow, and annotates ● Dynamic: Annotated at . provenance metadata into container build time ] ● Workflow dependencies are defined by Application Container corresponding containers ● Static: Annotated at runtime Inputs[]/Outputs[] Scaling to Distributed CI: Workflow Execution via Pegasus Provenance Metadata in Action: Forensic Traceability at Benefits to Scientific Cyberinfrastructure Every Workflow Step • Impacts scientific workflows across diverse domains — Integrating fine-grained containerized workflows with the Pegasus Workflow Management System enables scalable, parallel execution across distributed including bioinformatics, Earth science, materials science, cyberinfrastructure. We validate our approach on a real bioinformatics and physics — where verifiable data lineage and result variant-calling workflow (E. coli, 8 sequencing runs) deployed on Purdue Anvil via integrity are essential for trustworthy, reproducible NSF ACCESS, demonstrating that Pegasus achieves near-constant runtime as research workflow parallelism increases • Establish trust in workflows by ensuring data integrity, reproducibility, and reusability—raising the standard for open and explainable science across HPC/HTC platforms. Risks Versus Potential For Advances • Risks: Integration of forensic analytics may introduce overhead or complexity; adoption requires cultural and technical shifts in workflow communities ○ Payoff: Sets a new benchmark for trustworthy, reproducible scientific workflows; enables cross-domain reuse, reduces costs; and builds 8 sequencing runs produce highly variable final workforce expertise in secure and explainable CI. variant counts from heterogeneous read datasets The 2nd Cybersecurity Innovation for Cyberinfrastructure (CICI) Principle Investigator Meeting May 11-12, 2026 | Los Angeles, California"

