  pdfText: "Prompt, Reliable, and Safe Security Updates for Cyberinfrastructure NSF CICI: Transition to Cyberinfrastructure Resilience (TCR) | Award #2319880 PI: Jun Xu | Co-PIs: Thomas Cheatham, Hang Liu University of Utah & Rutgers University | Deployment Partner: Utah Center for High-Performance Computing (CHPC) MOTIVATION THRUST 1: Patch Presence Management THRUST 2: Patch Reliability Testing THRUST 3: Patch Safety Assessment Cyberinfrastructure (CI) drives modern Task 1.1: Patch Management System Task 2.1: Patch-driven Regression Testing Task 3.1: Dependency Graph Construction scientific discovery. It carries high-value data • Open-source frameworks (Uyuni, Foreman) + • Hybrid fuzzing tailored for patch sites with • System-wide dependency graph via static + and massive computing resources, becoming a community-driven data source for CI software patch-driven scheduling and mutation dynamic analysis for C/C++, Python, and prime target for cyber attacks. (SAVIOR) binaries Task 1.2: Patch Presence Detection \"As many as 85% of targeted attacks are • Semantic analysis to detect unadopted Task 2.2: Differential Patch Analysis Task 3.2: Patch Safety Testing preventable via patching.\" — US-CERT patches in self-compiled software (PDiff) • Compare patched vs. unpatched versions to • Minimal testbed with only affected Timely security updates are the most practical verify fix effectiveness and detect regressions components; coverage-based fuzzing for safety Task 1.3: Patch Urgency Assessment defense, yet CI facilities face unique challenges (DarkSea) assessment • Automatic Exploit Generation to that they lack the resources or expertise to demonstrate attack consequences (FUZE, address. EXPGraph) OPEN CHALLENGES ✖ Lacking Patch Management [Promptness] TRANSITION & EVALUATION CI cannot afford commercial systems. Self- compiled software escapes package managers. 3-Phase Transition to CHPC: Phase 1 - Lab (VMs simulating CHPC) → Phase 2 - Testbed (retired HPC nodes) → Phase 3 - Production (full CHPC deployment) ✖ Missing Patch Testing [Reliability] Evaluation: Maturity (defects/week, outages, coverage) | Security (# unadopted/critical/defective patches) | Cost (admin hours, computing Open-source patches lack quality control. They resources) can be incomplete, defective, or malicious. Deployment: Systems deployed to Utah CHPC (5,600 users). Will disseminate to PNNL, ORNL, and Rutgers OARC. All tools to be open-sourced. ✖ Unsafe Patch Deployment [Safety] Patches break dependents (e.g., GPU driver updates breaking CUDA/PyTorch). RESULTS & FINDINGS OUR GOAL Toolchain: AI-based audit — agent with binary decompilation + static analysis checks patch alignment (Vulnerable / Patched / No Use). Enable prompt, reliable, and safe CVE + Patch Database (2020–2026): 216 projects, 3,898 unique CVEs, 1,910 patch commits. security updates for CI CHPC Deployment (Apr 2025 – Mar 2026): 813 projects monitored (568 open-source, 113 closed-source, 132 custom); 6,528 binaries scanned. Three research thrusts: What Our Scientists Are Running On: 399 unpatched CVEs identified in CHPC binaries loaded by users. Popular software include libxml2, git, gdal, and Promptness → Reliability → Safety postgresql. The earliest CVE traces back to 2020 (CVE-2020-24977, libxml2 2.9.9). This material is based upon work supported by the National Science Foundation under Award #2319880 | Contact: junxzm@cs.utah.edu"

- title: "Towards Secure and Usable Push Notification Authentication"
