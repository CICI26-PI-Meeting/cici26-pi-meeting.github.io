  pdfText: "NSF CICI #2115134 A Software System for FHE- and MPC-based Privacy-Preserving Computation: Design, Analysis, Implementation, and Prototype PI: Shouhuai Xu (University of Colorado Colorado Springs; sxu@uccs.edu; https://xu-lab.org/) Co-PI: Charles Benight (University of Colorado Colorado Springs) Co-PI: Yanyan Zhuang (University of Colorado Colorado Springs) Problem Statement: ❖ How can we enable privacy-preserving computation over sensitive data (i.e., sharing data utility without sharing data per se) in real-world environments (e.g., scientific research settings)? ❖ Example application: Sensitive medical data (e.g., EHRs, genomic data, and clinical research records) are highly valuable for medical analytics research but cannot be shared with researchers because of privacy concerns and regulations. Privacy-preserving computation provides a practical solution to this problem. Challenges: Overview of Results and Impacts: ❖ Sensitive (e.g., medical) data often do not have ❖ Design and implement FHE-based and MPC-based standard or widely accepted data schema or privacy-preserving computation systems. structure (e.g., different attributes are used to ❖ Analyze trade-offs among efficiency, data represent the same thing). precision, and computation expressiveness. ❖ Practical privacy-preserving computation ❖ Can be adopted by any scientific research involves trade-offs among speed, precision, etc. community to solving their data-sharing problem ❖ There is no one-size-fits-all solution. via privacy-preserving computation approaches. Figure 1. Architecture of Fully Homomorphic Encryption (FHE)-based solution Figure 2. Architecture of Multi-Party Computation (MPC)-based solution Use Cases of FHE-based Solution: Use Cases of MPC-based Solution: ❖ One data owner wants to help data consumers (e.g., ❖ Data owners (i.e., participants) want to conduct researchers) in leveraging their data for meaningful computation on their joint data (e.g., the union of their purposes,