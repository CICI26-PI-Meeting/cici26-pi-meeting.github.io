- title: "A Data Provenance Framework for Medical Machine Learning Research"
  author: "Yuan Tian, Aichi Chien, Yanyan Zhuang"
  filename: "A-Data-Provenance-Framework-for-Medical-Machine-Learning-Research-Yuan-Tian-Aichi-Chien-Yanyan-Zhuang.pdf"
  pdfText: "CICI: IPAAI: A Data Provenance Framework for Medical Machine Learning Research # 2531140 Yuan Tian (UCLA), Aichi Chien (UCLA), Yanyan Zhuang (UCCS). Presenter: Zihang Xiang Project Overview • Infer whether shared models used compromised datasets • Log dataset lineage / transformations across ML workflows • Unlearn corrupt data without full retraining • Store models provenance securely in cyberinfrastructure Need for Integrity, Provenance and Authenticity (IPA): • Detect public ML models trained on corrupt data • Standardize efficient, reproducible dataset–model tracking • Remove patient or corrupt data from models effectively Technical approaches: • Thrust 1: dataset inference • Thrust 2: provenance • Thrust 3: unlearning Resulting benefits: Evaluating and demonstrating IPA: Risks versus potential for advances: The 2nd Cybersecurity Innovation for Cyberinfrastructure (CICI) Principle Investigator Meeting May 11-12, 2026 | Los Angeles, California"

- title: "FoodGuard: Enabling a Safe and Directive Multi-modal Foundation Model Ecosystem for Food Science Research"
  author: "Zhe Zhao, Muhao Chen, Xin Liu, Nitin Nitin"
  filename: "FoodGuard-Enabling-a-Safe-and-Directive-Multi-modal-Foundation-Model-Ecosystem-for-Food-Science-Research-Zhe-Zhao-Muhao-Chen-Xin-Liu-Nitin-Nitin.pdf"
  pdfText: "FoodGuard: Enabling a Safe and Directive Multi-modal Foundation Model Ecosystem for Food Science Research Zhe Zhao, Muhao Chen, Xin Liu, Nitin Nitin What is FoodGuard? ● AI Model Profiling and recommendation for scientific tasks. ● Guardrail for model safe usage in scientific collaboration. ● Integrate with critical food science applications. How does FoodGuard work? ● multi-task recommendation for AI model adaptation. ● Evolutionary redteaming and slow thinking guardrail. ● Practical and safe use of AI for food science workflow. Our Plan and Progress ● Year 1: Model Recommendation, Safety Model ● Year 2: FoodGuard for Microbial Detection ● Year 3: FoodGuard for Formula Design Overview Recommending Foundation Models for Food Science Benchmarking and Reducing Food Safety Risks in LLMs (Luo et al. 2026) Learning from 1.6M past evaluations to recommend the right foundation model for any food science task — outperforming GPT-4o-mini by +50% on NGQA. Key Findings on Nutritional Graph QA: ● Zero-shot transfer — NGQA was unseen at training time, Data generation pipeline recommendations still hold. ● Derive seed safety principles from FDA food safety taxonomy ● Per-task winners differ — Qwen3-8B ● Generate benign and harmful queries from these principles for binary/generation, ● Filter with similarity constraints to reduce redundancy GPT-OSS-20B for multi-label. ● Manually review for quality, safety relevance, and diversity ● +38% to +50% over GPT-4o-mini default, with <20B-param models only. Data-Efficient Microbial Detection for Food Safety ● Current LLM guardrails overlook critical risks in the food-related domain. ● FoodGuard-4B Why is 60x adaptation needed demonstrates exceptional detection performance. ● High-zoom image collection: slow and ● FoodGuard-4B can be expensive leveraged to detect ● Narrow optical fields require constant manual out-of-distribution jailbreak focus. attacks. Our results and impact ● Extend FoodGuardBench to multi-agent food workflows ● Study risks in embodied food settings such as kitchens or ● 84.6% accuracy using only 32 target images production systems ● 16.2% performance increase over baseline ● Evaluate personalized safety reasoning for users with allergies, ● Zoom agreement regularization enables high data efficiency pregnancy, or health risks This material is based upon work supported by the National Science Foundation under Grant No. 2531126"

- title: "FORCORE: Fortifying Cyberinfrastructure Operations for Research and Education at B-CU"
  author: "Christopher Winlock, Kekeli Nuviadenu, Dawn Eastmond, Jamari Cleveland, Samuel Amanor"
  filename: "FORCORE-Fortifying-Cyberinfrastructure-Operations-for-Research-and-Education-at-B-CU-Christopher-Winlock-Kekeli-Nuviadenu-Dawn-Eastmond-Jamari-Cleveland-Samuel-Amanor.pdf"
  pdfText: "FORCORE: FORTIFYING CYBERINFRASTRUCTURE OPERATIONS FOR RESEARCH AND EDUCATION AT B-CU PI. Christopher Winlock1; Co-PI Kekeli Nuviadenu, PhD2; Dawn Eastmond, PhD3; Jamari Cleveland1; and Samuel Amanor1 Center for Information Technology1; College of Arts and Humanities2; College of Science, Engineering, and Mathematics3 Bethune-Cookman University, Daytona Beach, Florida 32114 INTRODUCTION: The FORCORE (FORTIFYING CYBERINFRASTRUCTURE OPERATIONS FOR RESEARCH AND EDUCATION) project aims to transform Bethune-Cookman University’s cyberinfrastructure by addressing critical performance bottlenecks and establishing a secure, high-performance, and research-enabled network environment. Baseline iPerf testing reveals significant variability across campus, with throughput ranging from approximately 100 Mbps in legacy environments to near 1 Gbps in partially upgraded buildings, highlighting the need for a comprehensive modernization effort. To address these challenges, FORCORE will standardize network performance to ≥1 Gbps at the edge while deploying a 10 Gbps backbone by September 2026. This upgrade will be coupled with the implementation of AI-driven, behavior-based cybersecurity systems that enable real-time threat detection, adaptive response, and continuous monitoring. Beyond infrastructure improvement, the project establishes a cybersecurity research platform, transforming the campus network into a live testbed for studying the interaction between high-speed data transfer and advanced security models. This environment will support research on detection accuracy, automated response, and the impact of adaptive security on performance in 1–10 Gbps environments. By integrating high-performance networking with advanced cybersecurity, ForCORE will enhance research capacity, enable data-intensive collaboration, improve student learning experiences, and position B-CU as a model for scalable, secure cyberinfrastructure at HBCUs and other under-resourced institutions. DATA: Current network performance varies significantly across buildings, with measured throughput ranging from ~100 Mbps in legacy infrastructure to ~900 Mbps in partially upgraded environments. While the nominal network capacity is 1 Gbps, these results demonstrate inconsistent performance and clear bottlenecks. The ForCORE project will standardize performance to meet or exceed the 1 Gbps baseline across all buildings and transition to a 10 Gbps backbone by September 2026, enabling high-speed, data- intensive research and collaboration. RISKS EVALUATION AND DEMONSTRATION PLANS •INTEGRATION WITH LEGACY INFRASTRUCTURE: Transitioning from mixed 100 Mbps / 1 Gbps • STANDARDIZE NETWORK PERFORMANCE to ≥1 Gbps across five academic buildings, eliminating current environments to a standardized ≥1 Gbps edge with a 10 Gbps backbone may present bottlenecks identified in baseline iPerf testing (e.g., ~100 Mbps performance in legacy infrastructure). compatibility challenges during phased upgrades. •TEMPORARY SERVICE DISRUPTIONS: Network upgrades and equipment replacements may result in • DEPLOY AND VALIDATE A 10 GBPS CAMPUS BACKBONE by September 2026, enabling high-speed, data- short-term interruptions to campus connectivity. intensive research and collaboration. •CYBERSECURITY SYSTEM COMPLEXITY: Implementing AI-driven, behavior-based security systems • DEMONSTRATE MEASURABLE IMPROVEMENTS IN NETWORK PERFORMANCE RELATIVE TO BASELINE, INCLUDING: requires continuous tuning to maintain detection accuracy while minimizing false positives. • Increased throughput and reduced congestion •Change management and adoption: Effective use of new systems will require training and support for faculty, staff, and students. • Reduced latency • Decreased variability in performance over time POTENTIAL FOR ADVANCES • QUANTIFY PERFORMANCE GAINS IN PREVIOUSLY CONSTRAINED ENVIRONMENTS, INCLUDING order-of-magnitude •TRANSFORMATIONAL INFRASTRUCTURE: Eliminates identified bottlenecks (e.g., ~100 Mbps improvements (e.g., ≥10× increase in Fine Arts building throughput). constraints) and establishes consistent ≥1 Gbps performance at the edge with a 10 Gbps backbone, enabling high-speed, data-intensive research. • REDUCE MEAN TIME TO DETECT (MTTD) AND RESPOND (MTTR) to cybersecurity incidents through AI- •CYBERSECURITY RESEARCH PLATFORM: Establishes a real-world, high-performance testbed for AI- driven, behavior-based monitoring. driven, behavior-based cybersecurity, enabling research on threat detection, adaptive security models, and the interaction between security and network performance in 1–10 Gbps • EVALUATE EFFECTIVENESS OF AI-DRIVEN CYBERSECURITY SYSTEMS, INCLUDING: environments. • Detection accuracy and response time •RESEARCH ENABLEMENT: Supports advanced, data-intensive research across disciplines such as public health, climate science, and artificial intelligence through reliable, high-performance, and secure connectivity. • Number of automated threat responses (alerts triaged, quarantines applied, unauthorized devices contained) •INSTITUTIONAL IMPACT: Enhances competitiveness for external funding, strengthens faculty recruitment and retention, and prepares students for technology-driven careers. • Impact of adaptive security on network performance (ensuring minimal disruption to high-speed workflows) •RESILIENCE AND CONTINUITY: Improves disaster recovery and network reliability, ensuring continuity of research and operations during hurricanes and other disruptions. • IMPROVE USER EXPERIENCE, as measured by faculty and student satisfaction with network reliability and •SCALABILITY AND BROADER IMPACT: Provides a replicable model for cyberinfrastructure security usability. modernization at HBCUs and under-resourced institutions, expanding participation in national research ecosystems. • INCREASE RESEARCH CAPACITY AND COLLABORATION, including growth in the number, scale, and data intensity of external research partnerships leveraging B-CU’s upgraded infrastructure. The 2nd Cybersecurity Innovation for Cyberinfrastructure (CICI) Principle Investigator Meeting May 11-12, 2026 | Los Angeles, California"

- title: "REPAIRT: Securing xApps in Open RANs with Reliable and Principled AI Red-Teaming"
  author: "Francesco Restuccia, Flavio Esposito"
  filename: "REPAIRT-Securing-xApps-in-Open-RANs-with-Reliable-and-Principled-AI-Red-Teaming-Francesco-Restuccia-Flavio-Esposito.pdf"
  pdfText: "CICI: IPAAI: REPAIRT: Securing xApps in Open RANs with Reliable and Principled AI Red-Teaming PI: Francesco Restuccia, Northeastern University Co-PI: Flavio Esposito, Saint Louis University https://www.nsf.gov/awardsearch/show-award/?AWD_ID=2530896 The Open Radio Access Network (O-RAN) paradigm: O-RAN splits the RAN into three main components: Radio Unit (RU), Distributed Unit (DU), and Central Unit (CU) that operate under the supervision of the Near Real-Time RAN Intelligent Controller (Near-RT-RIC) and use third-party applications (xApps) for data-driven network control. Third-party developers create and monetize xApps through shared marketplaces. Need for Integrity, Provenance, and Authenticity (IPA): Improve IPA of Wireless Data and AI Models in O-RAN by: • AI is key for efficient O-RAN management using xApps • Expanding existing cyberinfrastructures for realistic data collection • This enables adversarial attacks aiming at altering • Enabling AI red-teaming in O-RAN to study stealthy threat vectors network operations through evasion/poisoning attacks • Enhancing data integrity/provenance incorporating traceability • IPA is needed to secure O-RAN deployments • Sharing datasets for AI research under open-source license The REPAIRT red-teaming effort will catalyze reproducible AML research in O-RAN, fulfilling the IPAAI program objective of making AI training data and results transparent, authentic, and broadly available Technical Approach: Project Outcome: Unique Properties of the Scientific Domain: AI Red-Teaming in O-RAN O-RANs operate in near-real-time, handling Develop hardware/software cyberinfrastructure for AI red-teaming of O-RAN xApps at scale. dynamic key performance metrics under strict Data Thrust 2: and Thrust 3: latency/reliability constraints. This requires real- SDR Config Colosseum time fine-grained detection/mitigation strategies. SLU Campus New Connection Testbed Red-Team to FABRIC Testbed Edge-toRack-to-ceiling cables at SLU Framework Algorithms Thrust 1: Defense to Proposed Dashboard Adversarial AI in O-RAN for CICI Analytics USRP rack, switches, and Edge Servers Quadrupeds Mobile Sensors Ceiling Antennas (Red Dots) PheNode Fixed Sensors SLU Testbed Planimetry Research Results: Inference-time Evasion Attack Training-time Poisoning Attack Machine Unlearning-based Defense Model Trainer xApps Catalog Attacker Dataset Operator Datasets Constraints DataGen 4 1) Data poisoning on KPIs during xApp 2 DRL 1 Agent 3 DRL 3 training to embed the attack Training Envir. Agents Training Setup Training xApps 2 2) Trigger by tampering E2 interface Config. Poisoned xApp 5 Digital Twin Space 4 Physical RAN Near-RT RIC 7 KPIs 9 E2 Interface xApp Dispatch 5 6 Runtime Channel RAN Control Action AI Agent 8 xApps Testing Emulator Analytics on RIC A. Lacava, S. Maxenti, L. Bonati, S. D’Oro, A. Oprea, T. Melodia, and F. T. Hassan, F. Meneghello, and F. Restuccia, “AdvO-RAN: Adversarial Restuccia, “How to Poison an xApp: Dissecting Backdoor Attacks to S. Sayyed, N. Bastian, M. De Lucia, A. Swami, and F. Restuccia, “CLUE: Deep Reinforcement Learning in AI-Driven Open Radio Access Deep Reinforcement Learning in Open Radio Access Networks,” Bringing Machine Unlearning to Mobile Devices,” IEEE/CVF WACV, Networks,” ACM MobiHoc, Houston, Texas, USA, 2025. Computer Networks, 2025. Tucson, Arizona, USA, 2026. The 2nd Cybersecurity Innovation for Cyberinfrastructure (CICI) Principle Investigator Meeting May 11-12, 2026 | Los Angeles, California"

- title: "A Unified Monitoring Approach to Enhancing the Security and Resiliency of Hazard Workflows"
  author: "Sudarsun Kannan, Ram Durairajan, Ulrich Kremer, Shiqing Ma, Long Tran, Veda Vadakalli, River Bartz"
  filename: "A-Unified-Monitoring-Approach-to-Enhancing-the-Security-and-Resiliency-of-Hazard-Workflows-Sudarsun-Kannan-Ram-Durairajan-Ulrich-Kremer-Shiqing-Ma-Long-Tran-Veda-Vadakalli-River-Bartz.pdf"
  pdfText: "CICI: TCR: A Unified Monitoring Approach to Enhancing the Security and Resiliency of Hazard Workflows on Heterogeneous Infrastructures PIs: Sudarsun Kannan¹, Ram Durairajan², Ulrich Kremer¹, Shiqing Ma3 Students: Long Tran¹, Veda Vadakalli¹, River Bartz² ¹Rutgers University ²University of Oregon 3University of Massachusetts Project URL: https://github.com/RutgersCSSystems/hazardmon-ds-public | Transition partners: SAGE Continuum, NDP (National Data Platform)| NSF Award # 2319944 • Setting. Edge cyberinfrastructure (e.g., SAGE/Waggle) deploys sensor-equipped edge nodes alongside on-site MicroDCs in remote locations for near real-time wildfire, flood, and hazard detection. • ML at the edge. Edge MicroDCs increasingly run ML workflows for real-time inference and training similar to traditional datacenters, but on tight power, memory, and trust budgets. Edge Node → Gateway → MicroDC • Multi-tenancy is the norm. A single MicroDC hosts diverse workloads: different sensor modalities (wildfire cameras, Current Deployments weather monitoring) and different functional roles (sensor ingestion, data logging, ML inference). • Our project. We are designing PAMS, a Priority-Aware Memory & Security framework. We are transitioning it into SAGE and NDP to deliver multi-tenancy that is performant, sustainable, and secure, without requiring OS kernel changes. Cybersecurity Innovation Being Transitioned Challenge 1: Managing Resources on Edge Systems Challenge 2: Security on Multi-Tenant Edge Systems Lab Testbed MicroDC Site SAGE Waggle Node Malicious or compromised co-tenants may run alongside Power-instrumented edge boards Solar-powered, rooftop-deployed Sensor-equipped edge • Edge and MicroDCs run concurrent workflows under trusted hazard workloads. compute hub tight compute, memory, network, and power budgets. Memory contention can leak tenant activity through page- • Contention arises across CPU, memory, accelerators, cache and heap behavior. storage, and network links. GPU/CPU side channels could reveal when detection runs • Memory contention is one example: heap, page cache, and which model is active. GPU buffers, and lookup tables compete across DoS attacks can inflate memory pressure and evict critical containers. victim data. Emergency offloads need attestation to reach trusted Battery voltage reduction Network packet loss • Containers isolate workloads but do not intelligently tenants. balance resources across them. App-level priority triggers abused through fake “critical” • Priority-oblivious control treats wildfire detection as signals. Security Vulnerabilities routine logging. • Edge runtimes lack integrated, power-aware scheduling. Resource Contention and Unfairness Setup and Analysis • Lab testbed: Jetson edge boards + power meters; single-socket Xeon + GPU MicroDC (16-core, 48 GB DRAM, P5000 GPU). • Workloads: YOLO wildfire inference (heap-heavy), RocksDB sensor logging (page-cache-heavy), adversarial co-tenant. Lower the better • Real deployment: SAGE Waggle nodes + MicroDC sites; NDP data fabric for telemetry export. • Performance metrics: Throughput, tail latency, energy. Empirical Evidence Wildfire-detection inference is consistently ~4× slower than Memory contention causes asymmetric degradation: RocksDB • Security metrics: Side-channel info-leakage, DoS resilience, anomaly- throughput drops sharply, while YOLO runtime increases under no-fire frames, turning timing into a side channel: a co-tenant observing latency can infer when a fire is being detected. detection precision/recall. shared execution. Approach: PAMS — Priority-Aware Memory & Security Framework Resulting Benefits and Transition Plan • Secure multi-tenancy without performance collapse Resource and Security Innovations • Lower static power and embodied carbon through right- • Unified treatment of memory types. Page cache, heap, sized memory use GPU buffers, look-up tables as first-class citizens • Stronger isolation for shared SAGE and NDP edge nodes • Application-level triggers. Apps signal pressure via cgroup • Security observability from existing resource signals pressure + page-fault tracking — no kernel patches • Transition to SAGE Waggle nodes, MicroDC sites, and NDP required telemetry • Predictive resource allocation. ML balances performance • Evaluate with YOLO, RocksDB, RabbitMQ, and adversarial co- vs. power, anticipates emergency off-load spikes tenants • Signed application triggers • Measure throughput, latency, energy, carbon, side-channel • Contention obfuscation prevent visibility to other tenants leakage, and DoS resilience during critical fire events such as side channels going dark • Anomaly detection from existing signals. Related Publications • Are Edge MicroDCs Equipped to Tackle Memory Contention?, Long Tran, River Bartz, Ramakrishnan Durairajan, Ulrich Kremer, Sudarsun Kannan, ACM HotStorage Risks vs. Potential for Advances 2025. • Risks: ML predictors may fail on unseen workloads; security • Stateful Triage for Reliable and Secure Wildfire Monitoring at the Edge, Long Tran, obfuscation may affect performance. River Bartz, Rajesh Sankaran, Ulrich Kremer, Ramakrishnan Durairajan, Sudarsun • Mitigations: Userspace-first design with static-policy fallback Kannan, IEEE MILCOM 2025. and open SAGE-style benchmarks. • Leveraging Prefix Structure to Detect Volumetric DDoS Attack Signatures with • Potential: Generalizes beyond hazard monitoring and Programmable Switches, Chris Misa, Ramakrishnan Durairajan, Arpit Gupta, Reza Rejaie and Walter Willinger, IEEE S&P 2024. establishes a unified resource-security primitive for edge CI. • Redesigning Edge-Centric Micro-Datacenters for Efficient Multitenancy, Sudarsun Kannan, River Bartz, Ramakrishnan Durairajan, Uli Kremer, ACM HotInfra 2024. The 2nd Cybersecurity Innovation for Cyberinfrastructure (CICI) Principle Investigator Meeting May 11-12, 2026 | Los Angeles, California"

