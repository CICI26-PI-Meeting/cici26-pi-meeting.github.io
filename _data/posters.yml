  pdfText: "NSF · CYBERSECURITY INNOVATION FOR CYBERINFRASTRUCTURE (CICI) · TCR · AWARD # 2319959 STARNOVA - Scalable Technology to Accelerate Research Network Operations Vulnerability Alerts Extending the UCSD Network Telescope with greynet coverage and ML-based anomaly detection to protect NSF scientific cyberinfrastructure at SDSC PI Ka Pui (Ricky) Mok · co-PI kc claffy (CAIDA, UC San Diego) · co-PI Fabian E. Bustamante (Northwestern University) Motivation Progress - Derive threat intelligence from Internet - Deployed 400Gbps traffic aggregators to SDSC Background Radiation (IBR) sent toward production networks UCSD network telescope (UCSD-NT) and San Diego Supercomputer Center (SDSC)'s - Developed software tools to automatically production network to improve the robustness, identify usable addresses for monitoring with integrity, and resilience of SDSC's iBGP tables cyberinfastructure - Expand the capability of UCSD-NT - Migrated traffic processing to new infrastructure infrastructure to supported by this award 1) cope with new traffic source and growing IBR traffic volume - Developed DarkSIM, a timeseries-based ML 2) faciliate the sharing of data with researchers method to detect anomlies in IBR and industry partners STARNOVA Infrastructure SDSC Greynet STARNOVA Cyberinfrastructure SDSC Traffic Greynet SDSCtraffic IM Potental threatNetwork flow DarkSIM Router intergration alerts analysis analysis SDSC greynet UCSD Non-profit traffic Live Darknet traffic Traffic Time series Traffic traffic packet summary database streams UCSD SwitchNon-telescope Router traffic Packet capture Compute cluster pcap Storage UCSD-NT Non-profile server (Virtual machines) & server Router FlowTuple files Unique source and destination IPs observed in SDSC greynet DarkSIM in action Publications Gao et al., \"DarkSim: A Similarity-Based Time Series Analytic Framework for Darknet Traffic\", Proc. ACM IMC 2024. Sultana et al., \"Survey on Packet Filtering\", ACM CCR Vol. 54 (3) p. 2-9, 2024.