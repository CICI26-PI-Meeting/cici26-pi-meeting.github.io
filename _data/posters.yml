- title: "Practical, Systematic Fuzz Testing for Securing Scientific Software"
  author: "Stefan Nagy, Jack Davidson"
  filename: "Practical-Systematic-Fuzz-Testing-for-Securing-Scientific-Software-Stefan-Nagy-Jack-Davidson.pdf"
  pdfText: "(#2419798) CICI: TCR: Practical, Systematic Fuzz Testing for Securing Scientific Software Prof. Stefan Nagy (PI; University of Utah; snagy@cs.utah.edu), Prof. Jack Davidson (Co-PI; University of Virginia; jwd@virginia.edu) Introduction: Project Motivation & Fundamental Research Contributions Scientific software underpins critical infrastructure—from national labs to large-scale simulation platforms—yet remains largely under-vetted by modern software testing. While coverage-guided fuzzing (shown below) revolutionized vulnerability discovery in conventional software, its effectiveness breaks down on scientific software due to three fundamental gaps: (1) lack of cross-language instrumentation for heterogeneous codebases, (2) the absence of scalable harness synthesis techniques for isolating component-level testing, as well as (3) missing input specifications that prevent effective generation of test cases. This project advances security vetting of scientific software by transitioning key advancements in fuzzing, developing new composable capabilities—(1) cross-language instrumentation, (2) automated harness synthesis, and (3) input specification recovery—extending the reach of fuzzing across today’s increasingly diverse, critical, and under-vetted ecosystems of scientific software libraries and applications. The project will transition its outcomes through deployment on real-world scientific cyberinfrastructure (e.g., ACCORD) as well as collaboration with scientific software developers, while releasing open-source fuzzing tools and integrating them into education and outreach efforts. To date, this project has already uncovered 227 new software defects, including in science-critical software like CPython and HDF5. Challenges: Why Scientific Software is Hard to Fuzz Thrust 1: Flexible Instrumentation Overview: We are developing a flexible, cross-language instrumentation framework that captures unified execution feedback across heterogeneous scientific software stacks (e.g., Python–C/C++–Fortran). Our SnakeCharmer (FSE’26) results highlight how critical program behavior spans language boundaries, such as Python interfaces and native C components jointly defining API semantics, data flow, and exception behavior. Outcomes: Our cross-language fuzzing efforts uncovered 20 new bugs in pure and native Python libraries, including a 17 year old error within CPython itself. We are now working on expanding this to other languages. Thrust 2: Automated Harnessing Thrust 3: Specification Extraction Overview: We are developing techniques to automatically recover input structure and semantics directly from programs and executions, enabling fuzzing to create valid, high-quality inputs for complex scientific software. Outcomes: Our semantics-aware binary fuzzing technique, Register-level Likely Invariants (FSE’26), surfaces 20 new bugs missed by coverage-guided fuzzing, while exploring 27× more unique program states. Overview: We are developing automated techniques to synthesize semantically-correct API harnesses that expose deep functionality of scientific software without manual effort. By generating and refining candidate call sequences, arguments, and data flows using mutation and correctness checking, our approach converges on constructing valid harnesses that enable effective fuzzing of complex, multi-language scientific software APIs. Outcomes: Our approach Oracle-guided Harnessing (ICSE’25) discovers 41 new bugs across real-world libraries, outperforming both developer-written harnesses and prior auto-harnessing, with 0% false positives. Research Impacts: Education, Publications, Discovered Bugs, and Open-Sourced Software Undergraduate/graduate courses developed: Papers in top security / systems / SE venues: Software defects discovered & reported: Open-source fuzzing tools released: ● CS 5493/6493: Applied Software Testing (Utah) 1× Affected scientific software: ● CS 4501/6501: Software Security Testing (UVA) ACSAC’25 3× 1×ICSE’25 227 University of Utah students found & reported FSE’26 60+ security defects in real-world software. 1×ATC’25 1×ASE’25 bugs cs.utah.edu/~snagy/courses/cs5493/bugs futures.cs.utah.edu/publications futures.cs.utah.edu/bugs github.com/orgs/FuturesLab/repositories The 2nd Cybersecurity Innovation for Cyberinfrastructure (CICI) Principle Investigator Meeting May 11-12, 2026 | Los Angeles, California"

- title: "Secure Containers in High-Performance Computing Infrastructure"
  author: "Yuede Ji, Xing Gao"
  filename: "Secure-Containers-in-High-Performance-Computing-Infrastructure-Yuede-Ji-Xing-Gao.pdf"
  pdfText: "CICI: UCSS: Secure Containers in High-Performance Computing Infrastructure PI: Yuede Ji (University of Texas at Arlington), Co-PI: Xing Gao (University of Delaware) Goal: Designing secure container solutions for high- Project 1: Large-scale container image security investigation in HPC performance computing (HPC) infrastructures. environment • Collected 4,784 container images in total, including 3,061 HPC infrastructure images and Motivation: 1,723 HPC applications images. • Container has become prevalent in major HPC infrastructures, e.g., • Combine multiple tools to detect vulnerabilities across multiple layers of the software Summit, Sierra, Piz Daint, and Frontera. Findings: • Container images are insecure. For example, a recent study on • The container images used in HPC have a large number of vulnerabilities, i.e., 2,109 vulnerabilities per image. neuroscience container images shows that there are 460 • The detected vulnerabilities tend to be highly serious vulnerabilities per image. • Most vulnerabilities have very low likelihood of being • The weak isolation between containers and hosts can lead to exploited. vulnerabilities. We have observed 11 such vulnerabilities in our study • Certain vulnerabilities with very high EPSS scores. since 2017. • Half of the vulnerabilities already have their patches available Thrust 1: Efficient vulnerability detection for container Project 2: Context-aware exploitability assessment Motivation: images • Thousands of CVEs ≠ Exploitable; CVSS ≠ real-world risk; Exploitation depends on environment constraints • Goal: Designing an efficient image vulnerability scanner to detect the Our Methodology: • Model exploitability as a context-dependent property shaped by technical feasibility, environmental exposure, images uploaded to the HPC infrastructure. operational constraints, and empirical attacker behavior • Utilize multiple large-language models with structured prompts to synthesize exploitability evidence • Task 1-1 converts different types of code to embedded control flow Findings: graph (ECG). • Container-aware prompting consistently suppresses high exploitability predictions across models, showing that deployment-aware prompting improves exploitability assessment • Task 1-2 converts ECG to code embedding with graph neural network • Deployment-aware signals, such as package presence, remediation status, and applicability constraints, and triplet-loss network. strongly shape exploitability assessments. • Task 1-3 proposes an efficient locality-sensitive hashing-based online vulnerability searching method. Thrust 2: Secure, lightweight and high-performance Project 3: Secure HPC Container Runtime Development Approach: container runtime • Using lightweight virtual machine based on Rust to achieve container-like latency while preserving isolation • Pruned hypervisor with only necessary modules to create VMs to reduce software complexity • Goal: Designing a container runtime tailored for the HPC • Customized image with minimum required packages that supports wide-range of HPC workloads infrastructure, which is both secure and high-performance. • Workload scheduler to improve performance by leveraging hardware features • Task 2-1 uses a lightweight virtual machine hypervisor as the Progress and on-going efforts: • Designed and implemented container runtime container runtime with various optimizations. supporting HPC workloads • Working on managing CPU features such as • Task 2-2 customizes the runtime based on HPC requirements on simultaneous multithreading (SMT) and non- hypervisor feature, file system, network, and GPU. uniform memory access (NUMA), as well as GPU features, such as NVIDIA Multi-Instance GPU • Task 2-3 designs a dynamical image debloating method that can (MIG). • Considering GPU L3 TLB and PCIe contentions on remove unnecessary files, software, and packages. designing workload scheduler"

