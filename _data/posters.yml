- title: "Cybersecurity Risks to Federally Funded Research"
  author: "Scott Russell"
  filename: "Cybersecurity-Risks-to-Federally-Funded-Research-Scott-Russell.pdf"
  pdfText: "CYBERSECURITY RISKS TO FEDERALLY FUNDED RESEARCH An overview of real risks through the lens of a light-hearted fictional science project called sasqWATCH. See how Trusted CI’s team can assist your research cybersecurity. sasqWATCH Mission To collect evidence worldwide as to the existence or non- existence of the Sasquatch and other Cryptids. sasqWATCH Core Operational Functions • Maintains the High Uptime Network for Tracking Ecological Rarities (HUNTER), a network of repurposed commodity hunting cameras across the US, Canada, and parts of Europe • Operate a data warehouse, hosted at Deep Forrest University • Analyze data and publish papers to raise awareness of cryptids sasqWATCH Cybersecurity Risks • Aging technology that is no longer supported • Downtime of instruments during once-in-a-generation sighting event • Leaked or manipulated data impacting sasqWATCH’s reputation • A compromise revealing location of sensors • Data loss resulting in loss of years of research • Difficulty of securely sharing insights with worldwide collaborators • Supply chain risks with new, hard-to-find technology How Trusted CI Can Help • We are funded to support federally funded research • Trusted CI Operational Technology Vendor Procurement Matrix - to assist communications with vendors about security o trustedci.org/ot-matrix • Trusted CI Framework - a holistic and mission-focused standard for managing cybersecurity o trustedci.org/framework Next Steps • It’s never too early to begin engaging with Trusted CI • Research Security Cohort engagements help universities build cybersecurity programs • Our \"Secure Use of AI\" team is looking for new risks arising from the use of artificial intelligence in research environments, and mitigations to those risks • Join us at the NSF Cybersecurity Summit - trustedci.org/summit This material is based upon work supported by info@trustedci.org trustedci.org the National Science Foundation under Agreement #A2407-049-089-064206.0."

- title: "Multi-Layer Data Provenance and Federated Learning for Securing Scientific AI Pipelines"
  author: "Wajih Ul Hassan, Aidong Zhang"
  filename: "Multi-Layer-Data-Provenance-and-Federated-Learning-for-Securing-Scientific-AI-Pipelines-Wajih-Ul-Hassan-Aidong-Zhang.pdf"
  pdfText: "#2530655 CICI: IPAAI: Multi-Layer Data Provenance and Federated Learning for Securing Scientific AI Pipelines PI: Wajih Ul Hassan (University of Virginia) Co-PI: Aidong Zhang (University of Virginia) Goal and Motivation: Core Topics: • Ensure the integrity, provenance, and authenticity • Provenance capture across hardware, kernel, and (IPA) of AI datasets used in scientific workflows application layers • Tackle threats arising from multi-source, distributed, • Privacy-preserving federated anomaly detection over and unverified scientific data distributed datasets • Enable traceability across the entire data lifecycle • Simulation of data-centric attacks for robustness evaluation from sensors to AI models • Open-source forensic tools to support investigation and • Promote accountability and public trust in scientific reproducibility computing • Usable interfaces that allow scientists to trace data misuse through natural language Technical Approach: • Capture tamper-evident provenance at scientific instruments using hardware- backed cryptographic signing • Track AI pipelines and OS events to record dataset transformations with minimal overhead • Fuse hardware, system, and AI events into a Unified Provenance Graph for fast forensic queries • Simulate realistic dataset attacks to stress-test the system and generate labeled training data • Detect cross-institution tampering via federated graph learning, with a natural language investigation assistant Research Areas: Evaluating and Demonstrating IPA: Potential Advances: • Secure telemetry and provenance • Demonstrate dataset tampering • First end-to-end provenance capture detection in genomics and climate framework from hardware sensors • Scalable graph construction, workflows through AI training compression, and querying • Validate provenance graph • Privacy-preserving cross-institution • Federated learning for anomaly and performance at scientific data collaboration manipulation detection scales • Open-source testbed and natural • Simulation of data and provenance • Show domain scientists can language interface that lower the attacks for benchmarking investigate integrity issues without barrier for scientists • Auditable AI via provenance traceability specialist expertise and human-in-the-loop investigation The 2nd Cybersecurity Innovation for Cyberinfrastructure (CICI) Principle Investigator Meeting May 11-12, 2026 | Los Angeles, California"

- title: "LLMDaL: LLM-Driven Data Labeling for Training ML Models"
  author: "Kemal Akkaya, Julio Ibarra, Yanzhao Wu, Jeronimo Bezerra, Abdulhadi Sahin"
  filename: "LLMDaL-LLM-Driven-Data-Labeling-for-Training-ML-Models-Kemal-Akkaya-Julio-Ibarra-Yanzhao-Wu-Jeronimo-Bezerra-Abdulhadi-Sahin.pdf"
  pdfText: "LLMDaL: LLM-Driven Data Labeling for Training ML Models Kemal Akkaya1, Julio Ibarra2, Yanzhao Wu2, Jeronimo Bezerra2, Abdulhadi Sahin2, Virginia Commonwealth University1, Florida International University2 https://adwise-vcu.github.io/adwise-lab/projects/llm_data_labeling.html Research Impact and Key Takeaways • Bridges the gap between production data and AI-based solutions. • Enables scalable, automated LLM-driven labeling for cybersecurity datasets • Reduces reliance on manual expert labeling • Generalizable to other domains beyond cybersecurity Scientific Cybersecurity Dataset Needs and Gaps Addressed • Scientific cyberinfrastructures are both critical and vulnerable and they operate under unique high-throughput and low-latency. • Current AI/ML approaches face real-world limitations • Progress is constrained by data challenges such as privacy, legal, and operational barriers. • The project addresses these gaps by delivering high-quality labeled cybersecurity datasets from real-world traffic on AmLight (Americas Lightpaths) by utilizing an LLM-driven labeling agent for automated data curation and labeling. Generating the Cybersecurity Dataset • Packet-level INT and network logs; IDS alerts, simulated attacks • In-house parsers for bidirectional flows with entropy features • LLM fine-tuned on cybersecurity knowledge and network data • LLM labeling agent with self-refinement, ensemble methods, and expert verification Benefits to Scientific Result Dissemination Plans Risks Versus Potential For Advances Cyberinfrastructure • Dataset available via LLMDaL • Complex multi-layer TCP/IP data • Production-grade, packet-level labeled website, updated annually to reflect processing required for LLM training datasets with multilevel classifications evolving threats datasets • LLM-driven labeling agent for automatic, • Code, tools, and resources open- • Consistent labeling needed to prevent high-quality label generation sourced on GitHub hallucination and concept drift • Enhances existing cybersecurity solutions • Tuning approaches published at • Opportunity for scalable, automated and enables new approaches for scientific conferences LLM-driven labeling, applicable to other cyberinfrastructure domains The 2nd Cybersecurity Innovation for Cyberinfrastructure (CICI) Principle Investigator Meeting May 11-12, 2026 | Los Angeles, California"

