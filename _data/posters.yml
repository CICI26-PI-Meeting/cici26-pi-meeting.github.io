  pdfText: "CICI: UCSS: Secure Machine Learning as a Service for Collaborative Scientific Research PI: Dr. Yushun Dong (Florida State University); Co-PI: Dr. Mengxin Zheng (University of Central Florida); Dr. Neil Gong (Duke University) Project URL: https://yushundong.github.io/CICI2026/ Collaboration and Usability Challenge Addressed Data Provider Model Owner Model User Thrust 1 — Model Confidentiality (against MEAs) Attackers can steal ML models via API querying. We propose proactive defenses combining sensitivity-regularized training and decision-focused Cyberinfrastructure (CI) ensemble modules at deployment to make replication computationally infeasible while preserving model utility. Thrust 2 — Data Secrecy (against MIAs) Adversaries can reconstruct sensitive training data from model outputs. We develop a Privacy Funnel framework that suppresses high-risk input prototypes in representations, alongside adaptive noise injection targeting and Information Technology Services suspicious queries to protect data without degrading performance. K-12: 36% State Govenment: 21% Thrust 3 — Inference Privacy (against data breaches) Local Govenment: 14% FSU Colleges: 14% User queries and outputs in CI environments are vulnerable to interception. Universities: 13% We design efficient homomorphic encryption with ciphertext-aware pruning and polynomial reduction to enable practical, fully encrypted inference. Others: 2% Technical Cybersecurity Solution • Model Confidentiality: Sensitivity Regularization; Model Ensemble. • Data Secrecy: Privacy Funnel; Suspicious Input Detection & Obfuscation. • Inference Privacy: Efficient Encryption; Dynamic Polynomial Reduction. Benefits to Scientific Cyberinfrastructure Result Dissemination Plans Risks Versus Potential For Advances • Strengthens security, integrity, and • Stolen model fidelity↓; • Risks: Performance overhead from reproducibility of MLaaS-based reconstructed feature distance↑; encryption; resistance to adoption if scientific 