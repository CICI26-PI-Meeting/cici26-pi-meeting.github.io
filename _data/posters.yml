  pdfText: "HPCSafeChain: Software Supply Chain Security in High- Performance Computing: Understanding, Evaluation and Transition PI: Mu Zhang (University of Utah) Co-PIs: Heng Yin (UC Riverside), Xunchao Hu (DeepBits) Cybersecurity Innovation ▪ Novel Attack Taxonomy for HPC SSC ▪ First HPC testbed/benchmark for evaluating SSC security solutions ▪ Validating and transitioning SSC security techniques in HPC Approach For Transitioning the Innovation ▪ Scientific computing relies on open-source software vulnerable to software supply ▪ Collaboration with real-world HPC centers: CHPC, HPCC, INL chain (SSC) attacks and vulnerabilities ▪ The applicability of SSC security research to HPC is underexplored, given ▪ A student co-advised by the HPCC team and given cluster admin rights HPC’s limited C/C++ package management, rapid AI package evolution, and ▪ Use collaborators’ feedback to verify the fidelity of our taxonomy, testbed, weaker installation controls. attacks and solutions Benefits to Scientific Cyberinfrastructure Evaluating and Demonstrating Transiton ▪ HPC admins: identifying outdated, vulnerable packages ▪ Expert/community’s feedback on our taxonomy, testbed and attack ▪ HPC users: detecting compromised, malicious artifacts benchmark ▪ HPC (security) researchers: developing a realistic HPC security testbed integrated ▪ Evaluating applicability of SSC security solutions using our HPC SSC with a comprehensive attack suite benchmark. security testbed and attack suite Risks Versus Potential For Advances Programmatic Details ▪ Risk 1: Completeness of attack surface exploration ▪ 3-year project started on January 2026 ▪ Risk 2: Challenges for admins/users in adopting SSC security techniques ▪ Led by University of Utah and with UC Riverside and DeepBits ▪ Mitigation: Prioritize high-profile attacks; focus on automation ▪ Unfunded collaborations with CHPC at UofU, HPCC at UC Riverside and ▪ Payoff: A practical solution to counter existing threats, which severely compromise Idaho National Laboratory the integrity and confidentiality of scientific computing tasks and data. Award No. 2530911 This material is based upon work supported by the National Science Foundation under Grant No. 2512345"

