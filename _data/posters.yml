  pdfText: "SCRYPTS-AI: Systems and CRYPtographic Tools for Scientific AI PI: Teodora Baluta (Georgia Tech) | Co-PIs: Vassilis Zikas (Georgia Tech), Rafail Ostrovsky (UCLA) NSF CICI Award #2531010 • 3-year project, started January 2026 Need for Integrity, Provenance, and Authenticity (IPA) in Scientific AI • Sensitive scientific data is increasingly used to train AI models, while regulations (GDPR, CCPA) mandate verifiable data removal and provenance. • Adversarial trainers can misrepresent how data was used or where models originated. Existing tools provide weak, ad-hoc guarantees and rarely consider an adversary that actively evades audits. • Black-box-only deployments (closed APIs, third-party fine- tunes) make auditing harder still: ground truth is unavailable, training data is secret, and customization recipes are proprietary. • Goal: provable, deployable mechanisms that let scientific collaborators trust AI artifacts — from training logs to released models — even when other parties may be adversarial. On-going Projects Statistically Verifiable Watermarks for Data Provenance Data Auditing via DP Black-box Estimation Model Provenance Testing • We study statistical verification under adversarial settings. We propose repudiation attacks on watermarks, lower bounding the adversarial [NeurIPS’25] “Model Provenance Testing for advantage. [Usenix’25] “General-Purpose f-DP Estimation Large Language Models” and Auditing in a Black-Box Setting” • We propose a data • We propose a general black-box marking algorithm that framework that audits the full enables highly privacy curve via only black-box detectable provenance access to the mechanisms under strong robust • We further propose a sequential, aggregators in sample-efficient auditing • We propose causal model federated learning approaches that gives anytime- provenance, together with reducing valid auditing verdict that model provenance to data Benefits to Scientific Cyberinfrastructure adaptively stop once sufficient