title: NSF CICI PI Meeting
description: >-
  The CICI PI Meeting brings together Principal Investigators funded through the
  National Science Foundation's Cybersecurity Innovation for Cyberinfrastructure
  (CICI) program to share research progress, exchange best practices, and
  strengthen collaboration.
preposition: "at"
baseurl: ""
url: ""

remote_theme: "DigitaleGesellschaft/jekyll-theme-conference@v3.7.2"

conference:
  # Information modals (shown as modal dialogs)
  # info_modals:
  #   - title: Important Announcement
  #     main_only: true
  #     text: This is an information modal that appears as a dialog.

  # Information bars (shown as alerts at the top of the page)
  info_bars:
    - title: Participant Guide Now Available
      color: primary
      text: |
        <ins>[The participant guide is now available for download!](/attend/guide)</ins>

      # - title: Important Notice
      #   color: warning
      #   text: |
      #     This is a non-dismissible information banner that will always be visible.
  lang: en
  tz: "-07:00"
  program:
    url: /program/
    time_steps: 15
    show_alltimes: true
  location:
    url: /attend/venue/
  navigation:
    links:
      - name: Home
        relative_url: /
      - name: Program
        relative_url: /program/
      - name: Events
        relative_url: /events/
      - name: Speakers
        relative_url: /speakers/
      - name: Attendee Information
        menu:
          - name: Participant Guide
            relative_url: /attend/guide
          - name: Poster Guidelines
            relative_url: /attend/poster
          - name: Code of Conduct
            relative_url: /attend/conduct
          - name: Venue
            relative_url: /attend/venue
          - name: Travel
            relative_url: /attend/travel
      - name: Registration
        relative_url: /registration/
      # - name: Organizers
      #   relative_url: /organizers/
  talks:
    tracks:
      - name: Logistics
        color: secondary
      - name: Plenary
        color: danger
      - name: Poster Session
        color: info
      - name: Breakout
        color: success
      - name: Panel
        color: warning
  meta:
    schema_org:
      disable: false
      event_status: scheduled
      event_attendance_mode: offline
      has_participation_offer:
        url: /registration/

plugins:
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-remote-theme

collections:
  talks:
    output: true
    permalink: /events/:title/
  speakers:
    output: true
    permalink: /:collection/:title/
  rooms:
    output: true
    permalink: /:collection/:title/

defaults:
  - scope:
      path: ""
      type: talks
    values:
      layout: talk
  - scope:
      path: ""
      type: speakers
    values:
      layout: speaker
  - scope:
      path: ""
      type: rooms
    values:
      layout: room
